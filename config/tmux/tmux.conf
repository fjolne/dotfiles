set -s default-terminal "tmux-256color"
set -s escape-time 0
set -s extended-keys always
set -s extended-keys-format csi-u
set -s focus-events on
set -s set-clipboard external
set -sa terminal-features ",xterm-kitty:extkeys"
set -sa terminal-overrides ",*256col*:Tc"
set -g base-index 0
set -g default-command "exec fish"
set -g history-limit 20000
set -g mouse on
set -g status-keys emacs
set-environment -gu VISUAL
setw -g aggressive-resize off
setw -g allow-passthrough on
setw -g allow-set-title on
setw -g automatic-rename-format "#{?pane_in_mode,[tmux],#{s/^\\[[^]]*\\] *//:#{pane_title}}}#{?pane_dead,[dead],}"
setw -g clock-mode-style 24
setw -g mode-keys vi
setw -g monitor-activity on
setw -g pane-base-index 0
setw -g window-status-activity-style fg=black,bg=yellow,bold
setw -g window-status-bell-style fg=black,bg=colour40,bold
setw -g window-status-current-format "#I:#W "
setw -g window-status-current-style reverse
setw -g window-status-format "#I:#W "

# sessions
bind -n M-C-Up    switch-client -p
bind -n M-C-Down  switch-client -n

# windows
bind -n M-C-Left  previous-window
bind -n M-C-Right next-window
bind -n M-C--     last-window
bind -n M-C-Enter new-window -c "#{pane_current_path}"
bind -n M-C-w     kill-window
bind -n M-C-0     select-window -t :=0
bind -n M-C-1     select-window -t :=1
bind -n M-C-2     select-window -t :=2
bind -n M-C-3     select-window -t :=3
bind -n M-C-4     select-window -t :=4
bind -n M-C-5     select-window -t :=5
bind -n M-C-6     select-window -t :=6
bind -n M-C-7     select-window -t :=7
bind -n M-C-8     select-window -t :=8
bind -n M-C-9     select-window -t :=9
bind -n M-<       swap-window -t -1 \; select-window -t -1
bind -n M->       swap-window -t +1 \; select-window -t +1

# panes
bind -n M-S-Left  select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-S-Up    select-pane -U
bind -n M-S-Down  select-pane -D

# Vi-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Ctrl+Shift+PageUp/Down for page scrolling
bind -n C-S-PPage copy-mode -u
bind -T copy-mode C-S-PPage send-keys -X page-up
bind -T copy-mode C-S-NPage send-keys -X page-down
bind -T copy-mode-vi C-S-PPage send-keys -X page-up
bind -T copy-mode-vi C-S-NPage send-keys -X page-down

# Ctrl+Shift+Arrow for line scrolling
bind -n C-S-Up copy-mode \; send-keys -X scroll-up
bind -T copy-mode C-S-Up send-keys -X scroll-up
bind -T copy-mode C-S-Down send-keys -X scroll-down
bind -T copy-mode-vi C-S-Up send-keys -X scroll-up
bind -T copy-mode-vi C-S-Down send-keys -X scroll-down
