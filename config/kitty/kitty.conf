# Replicated from ~/.config/kitty/kitty.conf.
font_family Iosevka Nerd Font
font_size 12

include current-theme.conf

# Shell integration is sourced and configured manually
shell_integration no-rc

disable_ligatures always
enable_audio_bell no
enabled_layouts vertical, horizontal, stack
scrollback_lines 10000
update_check_interval 0
window_padding_width 2


map ctrl+shift+alt+minus change_font_size all -1.0
map ctrl+shift+alt+plus change_font_size all +1.0
map ctrl+shift+minus no_op
map ctrl+shift+plus no_op
map ctrl+shift+tab no_op
map ctrl+tab no_op
map kitty_mod+/ launch --location=hsplit
map kitty_mod+alt+/ launch --location=vsplit
map kitty_mod+alt+left neighboring_window left
map kitty_mod+alt+right neighboring_window right
map kitty_mod+b launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused
map kitty_mod+e neighboring_window down
map kitty_mod+enter launch --type=tab --tab-title=current --location=after --cwd=current
map kitty_mod+f toggle_layout stack
map kitty_mod+i neighboring_window up
map ctrl+alt+0 send_text all \x1b[48;7u
map ctrl+alt+1 send_text all \x1b[49;7u
map ctrl+alt+2 send_text all \x1b[50;7u
map ctrl+alt+3 send_text all \x1b[51;7u
map ctrl+alt+4 send_text all \x1b[52;7u
map ctrl+alt+5 send_text all \x1b[53;7u
map ctrl+alt+6 send_text all \x1b[54;7u
map ctrl+alt+7 send_text all \x1b[55;7u
map ctrl+alt+8 send_text all \x1b[56;7u
map ctrl+alt+9 send_text all \x1b[57;7u
map ctrl+alt+minus send_text all \x1b[45;7u
map ctrl+alt+enter send_text all \x1b[13;7u
map shift+enter send_text all \x1b[13;2u
